<!-- File: article.html -->
<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'none'"
    >
    <meta name="description" content="記事帖の記事ページ。">
    <title>記事 | 記事帖</title>
    <link rel="stylesheet" href="./assets/vendor/katex/katex.css">
    <link rel="stylesheet" href="./app/styles/common.css">
    <link rel="stylesheet" href="./app/styles/article.css">
    <script type="module" src="./app/scripts/article.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">本文へ移動</a>

    <header class="site-header">
      <div class="shell">
        <a class="brand" href="./index.html">記事帖</a>
      </div>
    </header>

    <main id="main" class="article-shell">
      <nav class="back-link" aria-label="記事ナビゲーション">
        <a href="./index.html">← 記事一覧</a>
      </nav>

      <p id="article-status" role="status">記事を読み込んでいます…</p>

      <section id="article-error" class="error-panel" hidden>
        <h1 id="error-title">記事を表示できません</h1>
        <p id="error-message" role="alert"></p>
        <button id="retry" class="button secondary" type="button">
          再読み込み
        </button>
      </section>

      <article id="article" hidden>
        <header class="article-header">
          <h1 id="article-title"></h1>
          <p class="article-date">
            <time id="article-date"></time>
            <span>（JST）</span>
          </p>
          <div id="article-tags"></div>
        </header>

        <figure id="article-hero" class="article-hero"></figure>
        <div id="article-body" class="prose"></div>
      </article>

      <noscript>
        <p class="error">記事を表示するにはJavaScriptを有効にしてください。</p>
      </noscript>
    </main>

    <footer class="site-footer shell">
      <a href="./index.html">記事一覧へ戻る</a>
    </footer>
  </body>
</html>
